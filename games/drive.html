 if(qSet=='auto'&&state=='play'){fpsT+=dt;fpsN++;if(fpsT>2.5){const fps=fpsN/fpsT;fpsT=0;fpsN=0;if(fps<38&&qName!='low'){qName=qName=='high'?'med':'low';setupPost();size();buildScenery(TH.night)}}}
 if(HG.paused||stopT>0){if(stopT>0)stopT-=dt;render();return}tt+=dt;
 const sp=state=='play'?speed*(boost>0?1.6:1):5;if(state=='play')dist+=sp*dt;
 bendU.value.set(Math.sin(tt*.1+dist/500)*.0026,Math.sin(dist/330+1)*.00035);
 if(state=='play'){
  if(HG.qs.has('demo')){demoT+=dt;const ahead=objs.find(o=>o.l==lane&&o.m.position.z<0&&o.m.position.z>-18&&(o.t=='car'||o.t=='cone'));if(ahead&&demoT>.35){lane=lane==1?(Math.random()<.5?0:2):1;demoT=0}}
  speed=Math.min(55,16+dist/150);boost-=dt;inv-=dt;
  const nl=1+Math.floor(dist/1000);if(nl>level){level=nl;HG.sfx('level');msg.textContent='LEVEL '+level;setTimeout(()=>msg.textContent='',1200)}
  spawnZ+=sp*dt;while(spawnZ>-150){spawn(spawnZ-150);spawnZ-=Math.max(7,17-level*1.5)}
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.m.position.z+=sp*dt*(o.t=='car'?.6:1);if(o.t=='coin'||o.t=='bat')o.m.rotation.y+=dt*4;
   if(o.m.position.z>14){S.remove(o.m);objs.splice(i,1);continue}
   if(Math.abs(o.m.position.z)<2.2&&Math.abs(o.m.position.x-px)<1.6){
    if(o.t=='coin'){coins++;HG.sfx('coin');burst(px,1,0,16,0xffd400);const v=o.m.position.clone().project(C);HG.popText((v.x+1)/2*stage.clientWidth,(1-v.y)/2*stage.clientHeight-30,'+25','#ffd400')}
    else if(o.t=='bat'){boost=3;HG.sfx('power');burst(px,1,0,30,0x22ff88)}
    else if(inv<=0){lives--;inv=1.5;HG.sfx('hit');shakeT=.4;stopT=.08;burst(px,1,0,40,0xff5030);puff(px,1,10);if(lives<=0){state='over';HG.sfx('boom');const b0=HG.best('drive');HG.save('drive',score());const nu=CARS.filter(c=>c.need>b0&&c.need<=score()).map(c=>c.n);msg.innerHTML='GAME OVER<br><small>'+(nu.length?'UNLOCKED: '+nu.join(', ')+'<br>':'')+'Tap or press A to retry</small>'}}else continue;
    S.remove(o.m);objs.splice(i,1)}}}
 // road/texture scroll
 const off=(dist%ROADL)/ROADL;[aC,aN,aR].forEach(t=>t.offset.y=off*90);lt.offset.y=off*ROADL/12;updScenery(dist);
 // car physics feel: spring toward lane, body roll, pitch, suspension
 const tx=LANES[lane],ax=(tx-px)*60-vx*11;vx+=ax*dt;px+=vx*dt;roll+=((-vx*.035)-roll)*Math.min(1,dt*8);pitch+=(((boost>0?-.02:0)+(shakeT>0?.03:0))-pitch)*Math.min(1,dt*5);
 player.position.set(px,Math.sin(tt*22)*.008*(sp/20),0);player.rotation.set(pitch,-vx*.03,0);player.body.forEach(b=>{b.rotation.z=roll;b.position.y=Math.abs(roll)*-.2});
 player.wheels.forEach((w,i)=>{w.children.forEach(c=>c.rotation.x-=sp*dt/.36);if(i<2)w.rotation.y=-vx*.04});player.visible=inv<=0||Math.floor(now/90)%2==0;
 if(Math.abs(vx)>5&&state=='play'){puff(px-.86,1.4,1);puff(px+.86,1.4,1);skidAt(px-.86,1.35);skidAt(px+.86,1.35)}if(boost>0&&Math.random()<.5)puff(px,2.4,1);
 for(let i=0;i<SN;i++){const v=sv[i];if(v.l<=0){spos[i*3+1]=-99;continue}v.l-=dt*.9;spos[i*3]+=v.vx*dt;spos[i*3+1]+=v.vy*dt;spos[i*3+2]+=(v.vz+sp*.3)*dt}sg.attributes.position.needsUpdate=true;smoke.material.opacity=.45;
 for(let i=0;i<PN;i++){const v=pv[i];if(v.l<=0){pp[i*3+1]=-99;continue}v.l-=dt;v.y-=18*dt;pp[i*3]+=v.x*dt;pp[i*3+1]+=v.y*dt;pp[i*3+2]+=v.z*dt}pg.attributes.position.needsUpdate=true;
 skids.forEach((s,i)=>{s.z+=sp*dt;dummy.position.set(s.x,.015,s.z>40?999:s.z);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);dummy.updateMatrix();skid.setMatrixAt(i,dummy.matrix)});skid.instanceMatrix.needsUpdate=true;
 // spring chase camera
 const fwd=sp/55,target=new THREE.Vector3(px*.65,2.6+fwd*.5,7.2+fwd*1.2);const k=40,dmp=11;camVel.addScaledVector(target.clone().sub(camPos).multiplyScalar(k).addScaledVector(camVel,-dmp),dt);camPos.addScaledVector(camVel,dt);
 shakeT-=dt;const sk=shakeT>0?shakeT*.8:0;C.position.set(camPos.x+(Math.random()-.5)*sk,camPos.y+(Math.random()-.5)*sk,camPos.z);
 const b=bendAt(-40);look.lerp(new THREE.Vector3(px*.4+b.x*.5,1+b.y*.4,-12),Math.min(1,dt*4));C.lookAt(look);
 C.fov+=((58+fwd*14+(boost>0?10:0))-C.fov)*Math.min(1,dt*3);C.updateProjectionMatrix();
 // sun & headlights follow
 sun.position.set(px+TH.sun[0]*.3,TH.sun[1]*.5,TH.sun[2]*.3+(-10));sun.target.position.set(px,0,-6);
 heads.forEach((h,i)=>{h.position.set(px+(i?.6:-.6),.75,-2.2);h.target.position.set(px+(i?.6:-.6)-vx*.05,0,-30)});
 if(grade){grade.uniforms.uSpeed.value=Math.max(0,(sp-25)/40)+(boost>0?.6:0)}
 hud.innerHTML=state=='ready'?'':`${score()} <small>PTS</small> &nbsp; LVL ${level} &nbsp; ${'♥'.repeat(Math.max(0,lives))} &nbsp; ◎${coins} ${boost>0?'&nbsp; ⚡BOOST':''}<br><small>BEST ${HG.best('drive')} · ${CARS[carI].n} · ${TH.n} · ${qName.toUpperCase()}${qSet=='auto'?' (AUTO)':''} · ${Math.round(sp*3.6)} KM/H</small>`;
 render()}
function render(){if(composer)composer.render();else R.render(S,C)}
// ---------- title / garage ----------
const QOPT=['auto','low','med','high'];
const pickHTML=()=>`<div class="pick"><label>CAR</label>${CARS.map((c,i)=>`<button data-c="${i}" class="${i==carI?'on':''}" ${unlocked(i)?'':'disabled'}>${c.n}${unlocked(i)?'':'<br><small>🔒 '+c.need+'</small>'}</button>`).join('')}</div><div class="pick"><label>MAP</label>${THEMES.map((t,i)=>`<button data-t="${i}" class="${i==thI?'on':''}">${t.n}</button>`).join('')}</div><div class="pick"><label>GFX</label>${QOPT.map(q=>`<button data-q="${q}" class="${q==qSet?'on':''}">${q.toUpperCase()}</button>`).join('')}</div>`;
function refreshPick(){document.querySelectorAll('.pick button').forEach(b=>{if(b.dataset.c)b.classList.toggle('on',+b.dataset.c==carI);if(b.dataset.t)b.classList.toggle('on',+b.dataset.t==thI);if(b.dataset.q)b.classList.toggle('on',b.dataset.q==qSet)})}
function chooseCar(i){if(!unlocked(i))return;carI=i;HG.set('drive_car',i);setCar();refreshPick();HG.sfx('click')}
async function chooseTheme(i){thI=i;HG.set('drive_theme',i);await buildTheme();HG.music(TH.music);refreshPick();HG.sfx('click')}
function chooseQ(q){qSet=q;HG.set('drive_q',q);qName=q=='auto'?'high':q;setupPost();size();buildScenery(TH.night);refreshPick()}
HG.titleNav=k=>{if(k=='left'||k=='right'){let i=carI;do{i=(i+(k=='right'?1:2))%3}while(!unlocked(i));chooseCar(i)}if(k=='up'||k=='down')chooseTheme((thI+1)%2);if(k=='b')chooseQ(QOPT[(QOPT.indexOf(qSet)+1)%4])};
document.addEventListener('click',e=>{const b=e.target.closest('.pick button');if(!b)return;if(b.dataset.c)chooseCar(+b.dataset.c);if(b.dataset.t)chooseTheme(+b.dataset.t);if(b.dataset.q)chooseQ(b.dataset.q)});
await buildTheme();setCar();setupPost();size();
HG.music(Object.assign({title:1},TH.music));
HG.title({name:'HYPE DRIVE',sub:'Dodge traffic, grab coins, hit batteries for boost. Score to unlock cars.',extra:pickHTML(),ctl:['◀ ▶ lane / car','▲▼ map · B gfx','Start: pause'],c1:'rgba(255,61,110,.55)',c2:'rgba(10,6,24,.85)',c3:'#c2185b',game:'drive'}).then(()=>{HG.titleNav=null;HG.music(TH.music);reset()});
requestAnimationFrame(tick);
</script></body></html>
