<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Hype Hopper</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css"></head><body>
<script src="../common.js"></script><script>HG.chrome('Hype Hopper')</script><script src="../vendor/phaser.min.js"></script>
<script>
const T=18,ROWS=14,NLEV=5;
// Hand-designed levels. Segment = [length, groundTopRow (0 = gap), extras]
// extras: cA-B coins at cols A..B one above ground; eN walker; fN:H flyer H rows above ground; sN spike; hN heart; pN:H:L one-way platform H above ground (len L, coins on it);
//         PN:R:L platform at absolute row R (use in gaps); FN flag
const LEVELS=[
 {name:'MEADOW',sky:['#7fd0ff','#d8f3ff'],tint:0xffffff,hill:0x6fc3a8,etint:0xffffff,segs:[[12,11,'c6-9'],[8,11,'c2-5'],[2,0,''],[10,11,'e6 c3-4'],[10,10,'p2:3:4'],[3,0,''],[12,11,'e7 h10'],[8,9,'c1-6'],[2,0,''],[14,11,'e4 e10 p6:3:3'],[10,11,'F7']]},
 {name:'DUNES',sky:['#ffb36b','#ffe7c2'],tint:0xffe0b0,hill:0xe0a96d,etint:0xffc070,segs:[[10,11,''],[8,11,'s2 c4-7'],[3,0,''],[9,10,'e5'],[6,9,'c1-4'],[3,0,''],[10,9,'s3 s7 p4:3:2'],[12,11,'e3 f8:4'],[2,0,''],[10,10,'s4 c1-3 h7'],[2,0,''],[14,11,'e4 s8 e11'],[10,11,'F6']]},
 {name:'TWILIGHT',sky:['#2b1a5e','#b06ab3'],tint:0xc8b8ff,hill:0x5a3f9e,etint:0xd0a0ff,segs:[[10,11,''],[6,10,'c1-4'],[6,9,'e3'],[6,8,'c1-4'],[3,0,''],[8,9,'f4:4 s6'],[3,0,''],[10,10,'e4 p2:3:5'],[6,0,'P1:9:4'],[12,11,'e3 e7 e10 h5'],[8,9,'s4'],[3,0,''],[12,11,'f5:3 c2-9'],[10,11,'F6']]},
 {name:'CAVERN',sky:['#1b2330','#3c4a5e'],tint:0xa8b4c8,hill:0x2c3646,etint:0x9fe8ff,segs:[[10,11,''],[10,11,'e3 e7 c4-6'],[3,0,''],[8,10,'s3 s4'],[8,10,'e5 p2:3:3'],[6,0,'P1:9:4'],[10,11,'e3 e6 e9'],[6,9,'f3:3'],[3,0,''],[10,10,'s2 s7 c4-5 h9'],[12,11,'e3 e6 e9 f5:4'],[3,0,''],[12,11,'s4 s8 c1-3'],[10,11,'F6']]},
 {name:'SKYWAY',sky:['#5ec8ff','#ffffff'],tint:0xe6f8ff,hill:0xbfe8ff,etint:0xff9eb5,segs:[[10,11,''],[6,0,'P1:9:4'],[8,10,'e4'],[6,0,'P1:8:4'],[6,9,'c1-3'],[6,0,'P1:9:4'],[10,10,'f4:4 e6 c1-3'],[2,0,''],[8,9,'s4 h6'],[6,0,'P1:8:4'],[10,10,'e3 s6'],[3,0,''],[12,11,'f4:3 f9:3 c2-10'],[10,11,'F6']]}];
function build(L){const W=L.segs.reduce((a,s)=>a+s[0],0)+4,g=[];for(let y=0;y<ROWS;y++)g.push(Array(W).fill(-1));const ents=[];let x0=0,lastTop=11;
 for(const[len,top,ex]of L.segs){if(top)for(let x=x0;x<x0+len;x++)for(let y=top;y<ROWS;y++)g[y][x]=y==top?2:122;const base=top||lastTop;
  for(const t of ex.split(' ').filter(Boolean)){const k=t[0],a=t.slice(1).split(/[-:]/).map(Number);
   if(k=='c')for(let i=a[0];i<=(a[1]??a[0]);i++)ents.push(['c',x0+i,base-1]);
   if(k=='e')ents.push(['e',x0+a[0],base-1]);if(k=='f')ents.push(['f',x0+a[0],base-a[1]]);if(k=='h')ents.push(['h',x0+a[0],base-1]);
   if(k=='s')g[base-1][x0+a[0]]=68;if(k=='F')ents.push(['F',x0+a[0],base-1]);
   if(k=='p'||k=='P'){const row=k=='p'?base-a[1]:a[1];for(let i=0;i<a[2];i++){g[row][x0+a[0]+i]=6;ents.push(['c',x0+a[0]+i,row-1])}}}
  if(top)lastTop=top;x0+=len}
 for(let x=x0;x<W;x++)for(let y=lastTop;y<ROWS;y++)g[y][x]=y==lastTop?2:122;return{g,ents,W}}
// Hand-coded hero "Volt": 14x14 pixel robot-fox, 4 frames
const HP={o:'#1b1030',w:'#fff6e8',r:'#ff5a3c',y:'#ffd23f',b:'#2bd9ff',d:'#b8361f',k:'#3a2a55'};
const HB=['....o....o....','...oro..oro...','..orrrooorro..','..orrrrrrrro..','.orwwwwwwwwro.','.orwboowbbwro.','.orwbbwwbbwro.','.orrwwwwwwrro.','..orrryyrrro..','..odrrrrrrdo..','...orryyrro...'];
const legs={i:['...okk..kko...','...oo....oo...','..............'],a:['..okk....kko..','..oo......oo..','..............'],b:['....okkkko....','....oo..oo....','..............'],j:['..okko..okko..','.oo........oo.','..............']};
function heroSheet(){return HG.strip(['i','a','b','j'].map(f=>HG.pix(HB.concat(legs[f]),HP)))}
const best=()=>HG.best('platformer');
class Play extends Phaser.Scene{constructor(){super('play')}
 init(d){this.lv=d.lv||+HG.qs.get('test')||HG.get('plat_level',1);this.score=d.score||0;this.lives=d.lives??3}
 preload(){this.load.spritesheet('tiles','../assets/platformer/tiles.png',{frameWidth:18,frameHeight:18});this.load.spritesheet('ch','../assets/platformer/chars.png',{frameWidth:24,frameHeight:24})}
 create(){const D=LEVELS[this.lv-1],L=build(D);this.L=L;this.test=HG.qs.has('test');this.demo=HG.qs.has('demo')||this.test;
  if(!this.textures.exists('hero')){this.textures.addSpriteSheet('hero',heroSheet(),{frameWidth:14,frameHeight:14})}
  const sk='sky'+this.lv;if(!this.textures.exists(sk)){const c=document.createElement('canvas');c.width=4;c.height=256;const x=c.getContext('2d'),gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,D.sky[0]);gr.addColorStop(1,D.sky[1]);x.fillStyle=gr;x.fillRect(0,0,4,256);this.textures.addCanvas(sk,c)}
  this.cameras.main.setBackgroundColor(D.sky[1]);this.add.image(0,0,sk).setOrigin(0).setDisplaySize(L.W*T,ROWS*T);
  for(let i=0;i<L.W/5;i++)this.add.ellipse(i*90,ROWS*T-20,170+(i*37%70),150+(i*53%60),D.hill,.5).setScrollFactor(.5,1);
  for(let i=0;i<L.W/7;i++)this.add.ellipse(i*130+(i*71%50),20+(i*43%70),60,18,0xffffff,this.lv==4?.08:.6).setScrollFactor(.3,1);
  const map=this.make.tilemap({data:L.g,tileWidth:T,tileHeight:T});const ts=map.addTilesetImage('tiles');this.layer=map.createLayer(0,ts,0,0);
  this.layer.setCollision([2,122]);this.layer.forEachTile(t=>{if(t.index==6)t.setCollision(false,false,true,false);if(t.index>0)t.tint=D.tint});
  const A=(k,tex,f,r)=>{if(!this.anims.exists(k))this.anims.create({key:k,frames:this.anims.generateFrameNumbers(tex,{frames:f}),frameRate:r,repeat:-1})};
  A('run','hero',[1,2],10);A('idle','hero',[0],1);A('jmp','hero',[3],1);A('ew','ch',[18,19],5);A('ef','ch',[24,25,26,25],8);A('coin','tiles',[151,152],4);
  this.p=this.physics.add.sprite(2*T,8*T,'hero',0).setSize(8,11).setOffset(3,3);this.p.setScale(1.5);this.start=[2*T,8*T];
  this.physics.add.collider(this.p,this.layer,(p,t)=>{if(t.index==68)this.hurt()});this.physics.world.setBounds(0,-200,L.W*T,ROWS*T+400);
  this.coins=this.physics.add.staticGroup();this.hearts=this.physics.add.staticGroup();this.en=this.physics.add.group();this.fl=this.physics.add.group({allowGravity:false});this.spk=this.physics.add.staticGroup();
  L.g.forEach((r,y)=>r.forEach((v,x)=>{if(v==68){this.layer.removeTileAt(x,y);this.spk.create(x*T+9,y*T+9,'tiles',68).setTint(D.tint).refreshBody().body.setSize(10,6).setOffset(4,12)}}));
  for(const[t,x,y]of L.ents){const X=x*T+9,Y=y*T+9;
   if(t=='c')this.coins.create(X,Y,'tiles',151).play('coin');if(t=='h')this.hearts.create(X,Y,'tiles',44);
   if(t=='e'){const e=this.en.create(X,Y,'ch',18).play('ew').setTint(D.etint);e.setVelocityX(-40);e.body.setSize(16,14).setOffset(4,10)}
   if(t=='f'){const f=this.fl.create(X,Y,'ch',24).play('ef').setTint(D.etint);f.baseY=Y;f.baseX=X;f.t=x}
   if(t=='F'){this.add.image(X,Y-9,'tiles',111);this.add.image(X,Y+9,'tiles',131);this.flag=this.add.zone(X,Y-100,24,240);this.physics.add.existing(this.flag,true)}}
  this.physics.add.collider(this.en,this.layer);
  this.physics.add.overlap(this.p,this.coins,(p,c)=>{this.spark.explode(8,c.x,c.y);this.pop(c.x,c.y,'+10','#ffd23f');c.destroy();this.score+=10;HG.sfx('coin')});
  this.physics.add.overlap(this.p,this.hearts,(p,c)=>{this.pop(c.x,c.y,'+1 ♥','#ff5a3c');c.destroy();this.lives++;HG.sfx('power')});
  this.physics.add.overlap(this.p,this.spk,()=>this.hurt());
  const hit=(p,e)=>{if(p.body.velocity.y>0&&p.y<e.y-6){this.spark.explode(14,e.x,e.y);this.pop(e.x,e.y,'+50','#fff');e.destroy();p.setVelocityY(-300);this.score+=50;HG.sfx('pop');this.hitstop(60);this.cameras.main.shake(80,.006)}else this.hurt()};
  this.physics.add.overlap(this.p,this.en,hit);this.physics.add.overlap(this.p,this.fl,hit);this.physics.add.overlap(this.p,this.flag,()=>this.win());
  this.dust=this.add.particles(0,0,'tiles',{frame:151,lifespan:300,speed:{min:20,max:60},scale:{start:.3,end:0},alpha:{start:.6,end:0},tintFill:true,tint:0xffffff,emitting:false,gravityY:-50});
  this.spark=this.add.particles(0,0,'tiles',{frame:151,lifespan:450,speed:{min:60,max:140},scale:{start:.45,end:0},emitting:false,gravityY:300});
  const cam=this.cameras.main;cam.setBounds(0,0,L.W*T,ROWS*T);cam.startFollow(this.p,true,.12,.12);cam.setDeadzone(40,30);this.fit();this.scale.on('resize',()=>this.fit());
  this.hud=HUD;this.banner={setText:t=>BAN.innerHTML=t};this.banner.setText('WORLD '+this.lv+'<br><small>'+D.name+'</small>');this.time.delayedCall(1400,()=>this.banner.setText(''));
  this.coy=0;this.buf=0;this.wasOn=false;this.inv=0;
  HG.music([{bpm:132,root:60,scale:[0,2,4,7,9],lead:[0,2,4,2,5,4,2,null,0,2,4,7,6,4,5,null],bass:[0,null,0,null,3,null,3,null,4,null,4,null,3,null,2,null],drums:1},
   {bpm:120,root:57,scale:[0,1,4,5,7,8,10],lead:[0,1,4,null,5,4,1,0,7,null,5,4,1,null,0,null],bass:[0,null,null,0,1,null,null,1],drums:1},
   {bpm:100,root:55,scale:[0,2,3,5,7,8,10],lead:[4,null,2,null,0,null,2,3,4,null,7,null,6,null,4,null],bass:[0,null,null,null,5,null,null,null,3,null,null,null,4,null,null,null],wave:'triangle'},
   {bpm:110,root:52,scale:[0,2,3,5,7,8,10],lead:[0,null,null,3,null,null,2,null,0,null,null,5,null,4,null,null],bass:[0,0,null,0,null,0,3,null],drums:1},
   {bpm:144,root:62,scale:[0,2,4,5,7,9,11],lead:[0,4,7,4,9,7,4,2,0,4,7,11,9,7,4,null],bass:[0,null,4,null,5,null,4,null],drums:1}][this.lv-1]);
  HG.onPress=k=>{if(k=='a'||k=='up')this.jumpReq=true};HG.onPause=v=>v?this.scene.pause():this.scene.resume()}
 fit(){const cam=this.cameras.main;cam.setZoom(Math.max(2,this.scale.height/(ROWS*T)))}
 hitstop(ms){this.physics.world.pause();this.time.delayedCall(ms,()=>this.physics.world.resume())}
 pop(x,y,t,c){const cam=this.cameras.main,z=cam.zoom;HG.popText((x-cam.worldView.x)*z,(y-cam.worldView.y)*z-20,t,c,22)}
 hurt(){if(this.inv>0||this.won)return;this.lives--;this.inv=1.5;HG.sfx('hit');if(this.test)console.log('TEST_DIED',this.lv,Math.round(this.p.x/T));this.cameras.main.shake(200,.012);this.hitstop(120);this.cameras.main.flash(120,255,60,90);if(this.lives<=0)return this.over();this.p.setVelocity(-150*(this.p.flipX?1:-1),-220)}
 over(){if(this.test){console.log('TEST_GAMEOVER',this.lv);this.scene.pause();return}HG.save('platformer',this.score);HG.set('plat_level',1);this.physics.pause();this.banner.setText('GAME OVER<br><small>Tap or press A</small>');HG.onPress=k=>{if(k=='a')this.scene.restart({lv:1,score:0,lives:3})};this.input.once('pointerdown',()=>this.scene.restart({lv:1,score:0,lives:3}))}
 win(){if(this.won)return;this.won=true;if(this.test)console.log('TEST_CLEAR',this.lv,'lives',this.lives);HG.sfx('level');this.score+=200;HG.save('platformer',this.score);const n=this.lv%NLEV+1;if(!this.test)HG.set('plat_level',n);this.banner.setText(n==1?'YOU BEAT ALL WORLDS!':'WORLD CLEAR!');this.cameras.main.flash(300,255,255,255);if(!this.test)this.time.delayedCall(1400,()=>this.scene.restart({lv:n,score:this.score,lives:this.lives}))}
 bot(){const p=this.p,ly=this.layer,tx=Math.floor(p.x/T),ty=Math.floor((p.y-2)/T);const solid=(x,y)=>{const t=ly.getTileAt(x,y);return t&&(t.index==2||t.index==122||t.index==6)};
  let J=false;const groundAhead=[1,2].every(d=>{for(let y=ty+1;y<ROWS;y++)if(solid(tx+d,y))return true;return false});if(!groundAhead)J=true;if(p.body.blocked.right)J=true;
  if(solid(tx+1,ty)||solid(tx+2,ty))J=true;
  if(this.spk.getChildren().some(s=>s.x-p.x>4&&s.x-p.x<40&&Math.abs(s.y-p.y)<24))J=true;
  if(this.en.getChildren().some(e=>e.x-p.x>0&&e.x-p.x<46&&Math.abs(e.y-p.y)<20))J=true;
  if(this.fl.getChildren().some(e=>e.x-p.x>-10&&e.x-p.x<50&&p.y-e.y<30&&p.y-e.y>-10))J=true;return J}
 update(t,dt){const p=this.p,on=p.body.blocked.down||p.body.touching.down;let L=HG.held('left'),R=HG.held('right'),J=this.jumpReq,H=HG.held('a')||HG.held('up');this.jumpReq=false;
  if(this.demo){R=true;J=this.bot();H=true}
  const tv=L?-160:R?160:0,ac=on?.35:.18;p.setVelocityX(p.body.velocity.x+(tv-p.body.velocity.x)*ac);if(L)p.setFlipX(true);if(R)p.setFlipX(false);
  const d=dt/1000;this.coy=on?.1:this.coy-d;this.buf=J?.12:this.buf-d;
  if(this.buf>0&&this.coy>0){p.setVelocityY(-345);HG.sfx('jump');this.buf=0;this.coy=0;p.setScale(1.05,1.6);this.dust.explode(6,p.x,p.y+8)}
  if(!H&&p.body.velocity.y<-120)p.setVelocityY(p.body.velocity.y*.85);
  if(on&&!this.wasOn){p.setScale(1.6,1.05);this.dust.explode(5,p.x,p.y+8)}this.wasOn=on;p.scaleX+=(1.5-p.scaleX)*.2;p.scaleY+=(1.5-p.scaleY)*.2;
  p.anims.play(!on?'jmp':(Math.abs(p.body.velocity.x)>20?'run':'idle'),true);this.inv-=d;p.setAlpha(this.inv>0&&Math.floor(t/100)%2?0.4:1);
  if(p.y>ROWS*T+40){this.hurt();this.inv=1.5;p.setPosition(this.lastSafe||this.start[0],4*T);p.setVelocity(0)}if(on&&p.body.blocked.down)this.lastSafe=p.x-30;
  this.en.getChildren().forEach(e=>{const ex=Math.floor((e.x+(e.body.velocity.x>0?10:-10))/T),ey=Math.floor(e.y/T)+1,tl=this.layer.getTileAt(ex,ey);
   if(e.body.blocked.left||(e.body.velocity.x<0&&!tl))e.setVelocityX(40);else if(e.body.blocked.right||(e.body.velocity.x>0&&!tl))e.setVelocityX(-40);e.setFlipX(e.body.velocity.x>0)});
  this.fl.getChildren().forEach(f=>{f.t+=d;f.y=f.baseY+Math.sin(f.t*2)*14});
  this.hud.innerHTML=`WORLD ${this.lv}-${NLEV} &nbsp; ${'♥'.repeat(Math.max(0,this.lives))} &nbsp; ${String(this.score).padStart(5,'0')}<br><small>BEST ${best()}</small>`}}
const st=document.getElementById('stage');const HUD=document.createElement('div');HUD.className='hud px';st.appendChild(HUD);const BAN=document.createElement('div');BAN.className='hud';BAN.style.cssText='top:28%;left:0;right:0;text-align:center;font-size:48px;background:none;border:0';st.appendChild(BAN);
HG.title({name:'HYPE HOPPER',sub:'Guide Volt through five hand-built worlds. Stomp critters, grab coins, reach the flag.',ctl:['◀ ▶ move','A / ⤒ jump (hold = higher)','Start: pause'],c1:'#ff8a5c',c2:'#5a1f3a',c3:'#c2362a',game:'platformer'}).then(()=>new Phaser.Game({type:Phaser.AUTO,parent:'stage',pixelArt:true,width:st.clientWidth,height:st.clientHeight,scale:{mode:Phaser.Scale.RESIZE},physics:{default:'arcade',arcade:{gravity:{y:800}}},scene:[Play],banner:false}));
HG.rotHint();HG.touchButtons([{k:'left',label:'◀',style:'left:20px;bottom:20px'},{k:'right',label:'▶',style:'left:160px;bottom:20px'},{k:'a',label:'⤒',style:'right:24px;bottom:20px;width:150px;height:150px'}]);
</script></body></html>
